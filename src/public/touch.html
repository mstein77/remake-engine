<html>
<head>
    <style>
        body {
            background-color: #C0C0C0;
        }

        #game-div-container {
            display: flex;
            justify-content: center;
        }

        #game-div {
            width: 320px;
            height: 256px;
            transform: scale(2.0);
            transform-origin: center top;
            background-color: #000000;
            color: #D0D0D0;
            padding: 5px;
            border: 3px solid #5050A0;
        }

        #touch-dir-grid {
            display: grid;
            position: absolute;
            top: 50px;
            left: 50px;
            grid-template-columns: repeat(3, 50px);
            grid-column-gap: 10px;
            grid-row-gap: 10px;
        }

        .touch-dir-cell {
            height: 50px;
            border: 3px outset #A0A0A0;
        }
    </style>
</head>

<body>
    <div id="game-div-container">
        <div id="game-div">Game Screen</div>
    </div>
    <div id="touch-dir-grid">
        <div class="touch-dir-cell"></div>
        <div class="touch-dir-cell"></div>
        <div class="touch-dir-cell"></div>
        <div class="touch-dir-cell"></div>
        <div class="touch-dir-cell"></div>
        <div class="touch-dir-cell"></div>
        <div class="touch-dir-cell"></div>
        <div class="touch-dir-cell"></div>
        <div class="touch-dir-cell"></div>
    </div>
</body>
</html>
