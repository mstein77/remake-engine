<html>
    <head>
        <style>
            #touch-input-dir {
                position: absolute;
                top: 50px;
                left: 20px;
                display: grid;
                grid-template-columns: repeat(3, 50px);
                grid-column-gap: 8px;
                grid-row-gap: 8px;
            }

            #touch-input-dir > .touch-dir-cell {
                height: 50px;
            }

            #touch-input-buttons {
                position: absolute;
                top: 50px;
                right: 20px;
                display: grid;
                grid-template-columns: repeat(2, 80px);
                grid-column-gap: 20px;
                grid-row-gap: 60px;
            }

            #touch-input-buttons > .touch-dir-cell {
                height: 80px;
            }

            .touch-dir-cell {
                border: 2px outset #808080
            }

            .touch-dir-middle {
                border: none;
                background-color: transparent;
            }

            .touching {
                background-color: #FF0000;
            }
        </style>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
              rel="stylesheet">
        <link href="css/old.css" rel="stylesheet" />
    </head>

    <body>

        <canvas id="c" width="320" height="200"></canvas>

        <div id="root"></div>
    </body>

</html>
